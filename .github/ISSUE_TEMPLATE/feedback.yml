name: Playtest feedback
description: Tell us how a level or the game felt (the game fills in level and version for you).
title: "Feedback: "
labels: ["feedback"]
body:
  - type: input
    id: level
    attributes:
      label: Level
      description: Filled in by the game, e.g. "4-1 First Light". Leave as is.
  - type: dropdown
    id: feeling
    attributes:
      label: How did it feel?
      options:
        - Fun
        - Too easy
        - Too hard
        - Confusing
        - Something looked wrong
        - Bug / crash
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What were you trying to do, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version
      description: Filled in by the game.
  - type: input
    id: details
    attributes:
      label: Details
      description: Filled in by the game (stars, folds, screen, device).
