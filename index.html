<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#EFE6D6">
    <title>Fold Matrix — test build</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #EFE6D6; overflow: hidden;
                   font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #2B5E7A; }
      #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      /* Largest 9:16 portrait frame that fits above the footer, on phones and desktops alike. */
      #frame { position: relative;
               width: min(100vw, calc((100dvh - 44px) * 9 / 16));
               height: min(calc(100dvh - 44px), calc(100vw * 16 / 9)); }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #EFE6D6; touch-action: none; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
                 justify-content: center; gap: 18px; background: #EFE6D6; }
      #logo { font-size: 34px; font-weight: 800; letter-spacing: 1px; }
      #logo b { color: #CF6A2A; }
      #bar { width: 60%; height: 12px; border-radius: 6px; background: #D9C6A5; overflow: hidden; }
      #fill { height: 100%; width: 0; background: #0F766E; transition: width .2s; }
      #msg { font-size: 14px; min-height: 1em; text-align: center; padding: 0 16px; }
      #footer { height: 44px; display: flex; align-items: center; gap: 18px; font-size: 14px; }
      #footer a { color: #0F766E; font-weight: 700; text-decoration: none; }
      #footer a[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="frame">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="loading">
          <div id="logo">FOLD <b>MATRIX</b></div>
          <div id="bar"><div id="fill"></div></div>
          <div id="msg">Loading the paper…</div>
        </div>
      </div>
      <div id="footer">
        <span>Test build v0.10.0</span>
        <a id="feedback" target="_blank" rel="noopener" hidden>Send feedback</a>
      </div>
    </div>
    <script>
      // ---------------------------------------------------------------------------------------------------------------
      // FEEDBACK DESTINATION — the only line to edit after a build. Leave empty to hide every feedback button.
      // Placeholders filled by the game: {version} {content} {where} {level} {level_id} {level_title} {stars} {moves}
      // {best} {screen} {device}. Example (GitHub issue):
      //   "https://github.com/OWNER/REPO/issues/new?title=Feedback%20{level}&body=Level%20{level}%20({level_title})%2C%20v{version}%0A%0A"
      window.FOLDMATRIX_FEEDBACK_URL = "https://github.com/ajaykumar-wq/fold-play/issues/new?template=feedback.yml&title=Feedback%3A%20level%20{level}&level={level}%20{level_title}&version={version}%20({content})&details=stars%20{stars}%2C%20folds%20{moves}%2C%20best%20{best}%2C%20screen%20{screen}%2C%20{device}%2C%20from%20{where}";
      // ---------------------------------------------------------------------------------------------------------------

      var feedback = document.querySelector("#feedback");
      if (window.FOLDMATRIX_FEEDBACK_URL) {
        feedback.href = window.FOLDMATRIX_FEEDBACK_URL
          .replace(/\{version\}/g, encodeURIComponent("0.10.0"))
          .replace(/\{where\}/g, "page")
          .replace(/\{[a-z_]+\}/g, "");
        feedback.hidden = false;
      }

      var canvas = document.querySelector("#unity-canvas");
      var fill = document.querySelector("#fill");
      var msg = document.querySelector("#msg");
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "IICT",
        productName: "Fold Matrix",
        productVersion: "0.10.0",
        // Phones report 3x pixel ratios; 2x keeps the paper crisp at a fraction of the fill cost.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (text, type) { if (type === "error") msg.textContent = text; },
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
        }).catch(function (message) {
          msg.textContent = "Sorry — the game could not start in this browser. " + message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
