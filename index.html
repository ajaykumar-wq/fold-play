<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#EFE6D6">
    <title>Fold Matrix — test build</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #EFE6D6; overflow: hidden;
                   font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #2B5E7A; }
      #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      /* Largest 9:16 portrait frame that fits above the footer, on phones and desktops alike. */
      #frame { position: relative;
               width: min(100vw, calc((100dvh - 44px) * 9 / 16));
               height: min(calc(100dvh - 44px), calc(100vw * 16 / 9)); }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #EFE6D6; touch-action: none; }
      /* Loading screen (visual pass 2): the painted logo, Foldo, a paper progress strip and rotating tips. */
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
                 justify-content: center; gap: 2.2vh; padding: 0 8%;
                 background: radial-gradient(ellipse at 50% 42%, #FBF4E6 0%, #EFE6D6 62%, #E6D9C2 100%);
                 transition: opacity .45s ease; }
      #loading.done { opacity: 0; pointer-events: none; }
      #logo { width: 82%; max-width: 520px; height: auto; filter: drop-shadow(0 6px 0 rgba(43, 94, 122, .12)); }
      #foldo { width: 34%; max-width: 200px; height: auto; animation: bob 2.4s ease-in-out infinite;
               filter: drop-shadow(0 10px 8px rgba(43, 94, 122, .18)); }
      @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
      #bar { position: relative; width: 70%; max-width: 420px; height: 18px; border-radius: 10px; background: #D9C6A5;
             box-shadow: inset 0 3px 0 rgba(139, 111, 71, .35), 0 3px 0 rgba(255, 255, 255, .6); overflow: hidden; }
      #fill { height: 100%; width: 0; border-radius: 10px; transition: width .25s ease;
              background: repeating-linear-gradient(135deg, #0F766E 0 14px, #138276 14px 28px);
              box-shadow: inset 0 4px 0 rgba(255, 255, 255, .22); }
      #msg { font-size: 15px; font-weight: 700; min-height: 1.2em; text-align: center; }
      #tip { font-size: 14px; min-height: 2.6em; max-width: 420px; text-align: center; opacity: .85; transition: opacity .3s; }
      @media (prefers-reduced-motion: reduce) { #foldo { animation: none; } #fill, #loading, #tip { transition: none; } }
      #footer { height: 44px; display: flex; align-items: center; gap: 18px; font-size: 14px; }
      #footer a { color: #0F766E; font-weight: 700; text-decoration: none; }
      #footer a[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="frame">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="loading">
          <img id="logo" src="TemplateData/logo.webp" alt="Fold Matrix">
          <img id="foldo" src="TemplateData/foldo.webp" alt="">
          <div id="bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"><div id="fill"></div></div>
          <div id="msg">Folding the paper… 0%</div>
          <div id="tip">Drag the paper across a dashed crease to fold it.</div>
        </div>
      </div>
      <div id="footer">
        <span>Test build v0.20.0</span>
        <span id="feedback-note">Play 5 levels, then tap <b>Feedback</b> in the game</span>
      </div>
    </div>
    <script>
      // ---------------------------------------------------------------------------------------------------------------
      // FEEDBACK DESTINATION — the only line to edit after a build. Leave empty to hide every feedback button.
      // Placeholders filled by the game: {version} {content} {where} {level} {level_id} {level_title} {stars} {moves}
      // {best} {screen} {device} {levels_played}. Feedback opens in the game after 5 finished levels (playtest rule).
      // Example (GitHub issue):
      //   "https://github.com/OWNER/REPO/issues/new?title=Feedback%20{level}&body=Level%20{level}%20({level_title})%2C%20v{version}%0A%0A"
      window.FOLDMATRIX_FEEDBACK_URL = "https://github.com/ajaykumar-wq/fold-play/issues/new?template=feedback.yml&title=Feedback%3A%20level%20{level}&level={level}%20{level_title}&levels_played={levels_played}&version={version}%20({content})&details=stars%20{stars}%2C%20folds%20{moves}%2C%20best%20{best}%2C%20screen%20{screen}%2C%20{device}%2C%20from%20{where}";
      // ---------------------------------------------------------------------------------------------------------------

      // No page-level feedback link: the in-game button unlocks after 5 levels and fills in the details.
      if (!window.FOLDMATRIX_FEEDBACK_URL) document.querySelector("#feedback-note").hidden = true;

      var canvas = document.querySelector("#unity-canvas");
      var fill = document.querySelector("#fill");
      var msg = document.querySelector("#msg");
      var bar = document.querySelector("#bar");
      var tip = document.querySelector("#tip");
      var tips = [
        "Drag the paper across a dashed crease to fold it.",
        "The goal card shows the shape to make — and its size.",
        "Blue is the back of the paper. Some goals say which side may show.",
        "Undo is always safe. Foldo will offer a hint if you're stuck.",
        "Three stars: the fewest folds, with no hints.",
        "A new Daily Fold puzzle waits every day.",
      ];
      var tipIndex = 0;
      var tipTimer = setInterval(function () {
        tipIndex = (tipIndex + 1) % tips.length;
        tip.style.opacity = 0;
        setTimeout(function () { tip.textContent = tips[tipIndex]; tip.style.opacity = 0.85; }, 300);
      }, 3200);
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "IICT",
        productName: "Fold Matrix",
        productVersion: "0.20.0",
        // Phones report 3x pixel ratios; 2x keeps the paper crisp at a fraction of the fill cost.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (text, type) { if (type === "error") msg.textContent = text; },
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var pct = Math.round(100 * progress);
          fill.style.width = pct + "%";
          bar.setAttribute("aria-valuenow", pct);
          msg.textContent = pct < 100 ? "Folding the paper… " + pct + "%" : "Almost ready…";
        }).then(function () {
          clearInterval(tipTimer);
          var loading = document.querySelector("#loading");
          loading.classList.add("done");
          setTimeout(function () { loading.style.display = "none"; }, 500);
        }).catch(function (message) {
          msg.textContent = "Sorry — the game could not start in this browser. " + message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
